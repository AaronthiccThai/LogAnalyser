name: CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build Backend
        run: cmake -S . -B build && cmake --build build